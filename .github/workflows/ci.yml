name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} · ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: appleclang
    steps:
      - uses: actions/checkout@v4

      - name: Select compiler
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"  >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      # Fresh checkouts carry templates only: mint the reference trees
      # first (the glob-based build would otherwise configure an empty
      # project and pass vacuously).
      - name: Generate reference solution trees
        run: python3 tools/labs/generate.py --mode solution --force --targets all

      # Reference implementations only: learner skeletons are expected RED.
      - name: Configure (solutions, assertions on)
        run: cmake -S . -B build-solutions -DLABS_BUILD_SOLUTIONS=On
             -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-solutions -j

      - name: CTest (all chapters must be GREEN in solutions mode)
        run: ctest --test-dir build-solutions --output-on-failure --timeout 120

      - name: Portable-core lint
        run: python3 tools/labs/check_portable_core.py solutions

      - name: Manifest/DAG audit
        run: python3 tools/labs/audit_manifest.py

      - name: Hidden/unseen grade sweep vs solution binaries
        run: |
          mkdir -p build/skels
          ln -s "$(pwd)/build-solutions/solutions" build/skels
          python3 tools/labs/grade.py --repo .

  windows-msvc:
    # Best-effort portability probe (review #7). Not a merge blocker yet:
    # MSVC-specific fixes land as they surface.
    name: windows · msvc (best effort)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Configure (solutions)
        run: cmake -S . -B build-solutions -DLABS_BUILD_SOLUTIONS=On
      - name: Build
        run: cmake --build build-solutions --config Debug -j
      - name: CTest
        run: ctest --test-dir build-solutions -C Debug --output-on-failure
