name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: ${{ matrix.os }} · ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: appleclang
    steps:
      - uses: actions/checkout@v4

      - name: Select compiler
        if: matrix.os == 'ubuntu-latest'
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang"  >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi

      # Fresh checkouts carry templates only: mint the reference trees
      # first (the glob-based build would otherwise configure an empty
      # project and pass vacuously).
      - name: Generate reference solution trees
        run: python3 tools/labs/generate.py --mode solution --force --targets all

      # Reference implementations only: learner skeletons are expected RED.
      - name: Configure (solutions, assertions on)
        run: cmake -S . -B build-solutions -DLABS_BUILD_SOLUTIONS=On
             -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-solutions --parallel 1

      - name: CTest (all chapters must be GREEN in solutions mode)
        run: ctest --test-dir build-solutions --output-on-failure --timeout 120

      - name: Portable-core lint
        run: python3 tools/labs/check_portable_core.py solutions

      - name: Manifest/DAG audit
        run: python3 tools/labs/audit_manifest.py

      - name: External-track audit (foundations-c17)
        run: python3 tools/labs/audit_track.py foundations-c17

      - name: Grader self-tests (negative paths)
        run: python3 -m unittest discover -s tools/labs/tests -v

      - name: C17 track pedantic compile probe
        run: |
          python3 tools/labs/generate.py --track foundations-c17 --force \
            --todo 9999 --targets all --out /tmp/c17/gen-tree
          cmake -S tracks/foundations-c17 -B /tmp/c17/build \
            -DLABS_TEMPLATES_ROOT=/tmp/c17/gen-tree \
            -DCMAKE_C_FLAGS="-std=c17 -pedantic-errors"
          cmake --build /tmp/c17/build --parallel 1
          ctest --test-dir /tmp/c17/build --output-on-failure

      - name: Hidden/unseen grade sweep vs solution binaries
        run: |
          rm -rf build/skels
          mkdir -p build
          ln -s "$(pwd)/build-solutions/solutions" build/skels
          python3 tools/labs/grade.py --allow-missing-env --repo .
          python3 tools/labs/grade.py --pipeline --repo .
      # Fail-closed live verification (v008 #17/#18): generates
      # verification-current.json from the canonical CI environment and
      # fails the job if any required evidence dimension is not green.
      - name: Live verification gate
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'gcc'
        run: |
          python3 tools/labs/verify_current.py --repo . \
            --build-dir build-solutions --pipeline

      - name: Upload live verification snapshot
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'gcc'
        uses: actions/upload-artifact@v4
        with:
          name: verification-current
          path: verification-current.json

  windows-msvc:
    # Required portability gate: the template tree is MSVC-clean, so any
    # failure here is a real regression and blocks the merge.
    name: windows · msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate reference solution trees
        run: python tools/labs/generate.py --mode solution --force --targets all
      - name: Configure (solutions)
        run: cmake -S . -B build-solutions -DLABS_BUILD_SOLUTIONS=On
      - name: Build
        run: cmake --build build-solutions --config Debug --parallel 1
      - name: CTest
        run: ctest --test-dir build-solutions -C Debug --output-on-failure
